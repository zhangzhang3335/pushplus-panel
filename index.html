try{
var b=atob(B64);
var bytes=new Uint8Array(b.length);
for(var i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);
var text=new TextDecoder("utf-8").decode(bytes);
document.open();
document.write(text);
document.close();
}catch(e){
document.body.innerHTML='<div style="color:#f87171;text-align:center;padding:20px">Load failed: '+e.message+'</div>';
}
}
init();
